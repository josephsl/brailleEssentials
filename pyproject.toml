[tool.ruff]
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"*.py",
	"sconstruct",
]

exclude = [
	".git",
	"__pycache__",
]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
ignore = [
	# indentation contains tabs
	"W191",
]

[tool.ruff.lint.per-file-ignores]
# sconstruct contains many inbuilt functions not recognised by the lint,
# so ignore F821.
"sconstruct" = ["F821"]

[tool.pyright]
pythonPlatform = "Windows"
typeCheckingMode = "strict"

include = [
	"**/*.py",
]

exclude = [
	"sconstruct",
	".git",
	"__pycache__",
	# When excluding concrete paths relative to a directory,
	# not matching multiple folders by name e.g. `__pycache__`,
	# paths are relative to the configuration file.
]

# Tell pyright where to load python code from
extraPaths = [
	"./addon",
]

# General config
analyzeUnannotatedFunctions = true
deprecateTypingAliases = true

# Stricter typing
strictParameterNoneValue = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

# Compliant rules
reportAbstractUsage = true
reportAssertAlwaysTrue = true
reportAssertTypeFailure = true
reportAssignmentType = true
reportConstantRedefinition = true
reportDuplicateImport = true
reportGeneralTypeIssues = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportIncompleteStub = true
reportInconsistentConstructor = true
reportInconsistentOverload = true
reportIndexIssue = true
reportInvalidStringEscapeSequence = true
reportInvalidStubStatement = true
reportInvalidTypeArguments = true
reportInvalidTypeForm = true
reportInvalidTypeVarUse = true
reportMatchNotExhaustive = true
reportMissingModuleSource = true
reportNoOverloadImplementation = true
reportOptionalCall = true
reportOptionalContextManager = true
reportOptionalIterable = true
reportOptionalOperand = true
reportOptionalSubscript = true
reportOverlappingOverload = true
reportPrivateImportUsage = true
reportPrivateUsage = true
reportPropertyTypeMismatch = true
reportRedeclaration = true
reportTypeCommentUsage = true
reportTypedDictNotRequiredAccess = true
reportUnboundVariable = true
reportUnhashable = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportUnnecessaryIsInstance = true
reportUnnecessaryTypeIgnoreComment = true
reportUnsupportedDunderAll = true
reportUntypedClassDecorator = true
reportUntypedFunctionDecorator = true
reportUnusedClass = true
reportUnusedCoroutine = true
reportUnusedExcept = true
reportUnusedExpression = true
reportUnusedFunction = true
reportUnusedImport = true
reportWildcardImportFromLibrary = true

# Can be enabled by generating type stubs for modules via pyright CLI
reportMissingTypeStubs = false

# Bad rules
# These are sorted alphabetically and should be enabled and moved to compliant rules section when resolved.
reportArgumentType = false # Unclear argument types
reportAttributeAccessIssue = false  # Typos or other issues
reportCallInDefaultInitializer = false  # Confusing call types
reportCallIssue = false  # Confusing function calls
reportDeprecated = false  # Using deprecated Python functions/classes
reportFunctionMemberAccess = false  # Function objects
reportImplicitOverride = false  # Revisit overrides
reportImplicitStringConcatenation = false  # Add-on messages
reportImportCycles = false  # Revisit module imports list
reportMissingImports = false  # Mostly NVDA Core modules
reportMissingParameterType = false  # Missing parameter type in some functions
reportMissingSuperCall = false  # Revisit class init metohds
reportMissingTypeArgument = false  # Possible type misuse
reportOperatorIssue = false  # Revisit Python syntax
reportOptionalMemberAccess = false  # Revisit Python syntax
reportPossiblyUnboundVariable = false  # Revisit vairable assignment
reportReturnType = false  # Misusing return types
reportSelfClsParameterName = false  # Self versus cls misuse
reportUndefinedVariable = false  # _ = gettext.gettext call
reportUninitializedInstanceVariable = false  # Misuse of class syntax
reportUnknownArgumentType = false  # Unclear function argument types
reportUnknownLambdaType = false  # Possible misuse of lambda function
reportUnknownMemberType = false  # Attributes and classes coming from NVDA Core
reportUnknownParameterType = false  # Unclear parameter types
reportUnknownVariableType = false  # Types coming from NVDA Core
reportUntypedBaseClass = false  # Derives from classes defined in NVDA Core such as base global plugin class
reportUntypedNamedTuple = false  # Revisit named tuple usage
reportUnusedCallResult = false  # Not using function returns
reportUnusedVariable = false  # Revisit variable assignments
